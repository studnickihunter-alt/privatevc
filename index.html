<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Force-hide all Participant UI elements -->
  <style>
    #Menber-disp,
    #participant,
    #participant-list,
    #participant-list-container,
    [id*="part" i],
    [class*="part" i] {
      display: none !important;
    }
  </style>

  <title>MCBE ProxVC - Connect</title>

  <!-- Font Awesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Silkscreen&display=swap"
    rel="stylesheet">

  <script type="module" crossorigin src="./connect-CzI-A9K_.js"></script>
  <link rel="modulepreload" crossorigin href="./vendor-modules-Cs8TdbD0.js">
  <link rel="stylesheet" crossorigin href="./connect-CaBubcCo.css">
  <link rel="stylesheet" crossorigin href="./style-CC25_3lO.css">
</head>

<body class="min-h-screen flex flex-col relative selection:bg-green-500 selection:text-white">

  <div id="loading-screen"
    class="fixed inset-0 z-[9999] bg-gray-900 flex flex-col items-center justify-center transition-opacity duration-500">
    <div class="text-center">
      <i class="fa-solid fa-circle-notch fa-spin text-6xl text-green-500 mb-4 shadow-green-500/50 drop-shadow-lg"></i>
      <h2 class="text-2xl font-bold text-white pixel-font tracking-widest animate-pulse">LOADING</h2>
    </div>
  </div>

  <!-- Main Content Area -->
  <main class="flex-grow pt-32 px-4 pb-10 flex flex-col items-center justify-center min-h-screen z-10">
    <div class="w-full max-w-4xl fade-in">
      <div class="glass-card p-8 rounded-2xl relative">
        <button onclick="location.href='../'" class="absolute top-4 right-4 text-gray-400 hover:text-white transition">
          <i class="fa-solid fa-xmark text-2xl"></i>
        </button>

        <div class="flex justify-between items-end mb-6 border-b border-gray-600/50 pb-2">
          <h2 class="text-4xl font-bold pixel-font text-green-400" id='header-text' data-key="headerText">
            MCBE ProxVC
          </h2>
          <select id="language-switcher"
            class="bg-gray-800 text-gray-300 border border-gray-600 rounded px-3 py-1 text-sm focus:outline-none focus:border-green-400 transition"></select>
        </div>

        <div class="space-y-6">
          <!-- User Info Display -->
          <div class="bg-gray-800/50 rounded-xl p-4 border border-gray-700/50 space-y-2">
            <p id="id-disp" class="info-text">ID: <span id="my-id" class="text-white"></span></p>
            <p id="name-disp" data-key="nameDisp" class="info-text">GamerTag: <span id="my-name"
                class="text-white"></span></p>
            <!-- Hidden Participant Counter (kept in DOM so JS doesn't crash) -->
            <p id="Menber-disp" data-key="menberDisp" class="info-text" style="display: none !important;">Participants: <span id="Members"
                class="text-white">undefined</span></p>
          </div>

          <!-- Connection Form -->
          <div class="space-y-4">
            <div>
              <label id="address" data-key="address" class="block text-gray-300 mb-2 font-semibold">Room ID:</label>
              <input id="address-input" type="text" class="connect-input" placeholder="Enter Room ID" />
            </div>
            <div>
              <label id="gamertag" data-key="gamertag" class="block text-gray-300 mb-2 font-semibold">GamerTag:</label>
              <input id="user-name" type="text" class="connect-input" placeholder="Enter your GamerTag" />
            </div>
          </div>

          <div class="bg-gray-800/50 rounded-xl p-5 border border-gray-700/50 shadow-lg">

            <div class="flex flex-col md:flex-row items-stretch md:items-start justify-between gap-4 md:gap-6">

              <div id="controls-wrapper" class="flex flex-col gap-3 w-full md:w-fit">

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 w-full sm:w-auto">

                  <button id="NonMute-btn"
                    class="w-full sm:min-w-[15rem] h-14 px-4 bg-gray-700 hover:bg-gray-600 rounded-lg text-white text-sm font-bold transition tooltip flex items-center justify-center gap-3 border border-gray-600 shadow-md"
                    data-key="nonMuteBtn">
                    <i class="fa-solid fa-microphone-slash text-lg"></i>
                    <span data-key="nonMuteBtnLabel">Mute</span>
                  </button>

                  <button id="SpeakerMute-btn"
                    class="w-full sm:min-w-[15rem] h-14 px-4 bg-gray-700 hover:bg-gray-600 rounded-lg text-white text-sm font-bold transition tooltip flex items-center justify-center gap-3 border border-gray-600 shadow-md"
                    data-key="speakerMuteBtn">
                    <i class="fa-solid fa-volume-high text-lg"></i>
                    <span data-key="speakerUnmuted">Undefeaned</span>
                  </button>

                  <button id="noise-cancel"
                    class="w-full sm:min-w-[12rem] h-14 px-4 bg-gray-800 hover:bg-gray-700 border border-gray-500 rounded-lg text-white transition flex items-center justify-center gap-3 shadow-sm whitespace-nowrap">

                    <div class="flex flex-col items-center leading-tight">
                      <span data-key="ncLabel" class="text-xs text-white font-semibold uppercase">Noise Cancel</span>

                      <span id="nc-status" data-key="ncStatusOff"
                        class="font-bold text-sm bg-gray-600 px-2 rounded text-white mt-0.5">OFF</span>
                    </div>

                    <i class="fa-solid fa-wave-square text-white"></i>

                  </button>

                </div>

                <div id="global-volume-controller" style="display: none"
                  class="w-full h-14 bg-gray-900/60 rounded-lg border border-gray-700/50 flex items-center px-4 gap-4 transition-all">

                  <label data-key="masterVolumeLabel"
                    class="text-xs text-gray-400 font-bold uppercase tracking-wider whitespace-nowrap">
                    Volume
                  </label>

                  <div class="flex items-center gap-3 flex-1">
                    <span id="global-volume-icon" class="text-xl w-6 text-center">🔊</span>

                    <input id="global-volume-range" type="range" min="0" max="200" value="100"
                      class="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-blue-500 hover:accent-blue-400 transition-colors" />

                    <span id="global-volume-value"
                      class="text-sm font-mono font-bold text-blue-300 w-8 text-center bg-gray-800/80 rounded py-1 border border-gray-700">
                      100
                    </span>

                    <button id="global-volume-reset" title="Reset to 100"
                      class="text-gray-400 hover:text-white transition cursor-pointer text-xl font-bold flex items-center justify-center w-6 h-6">
                      ↺
                    </button>
                  </div>
                </div>

              </div>

              <div class="h-14 w-full md:w-auto md:ml-auto">
                <button id="join"
                  class="w-full md:w-auto h-full px-8 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-lg shadow-lg shadow-blue-500/20 transition flex items-center justify-center gap-2 whitespace-nowrap border border-blue-400/50">
                  <span data-key="join">Connect</span>
                </button>
              </div>

            </div>
          </div>

          <div id="button-area"></div>
          <div id="remote-media-area"></div>

          <!-- Hidden Participant List (kept in DOM so JS doesn't crash) -->
          <div id="participant-list-container" style="display: none !important;" class="bg-gray-800/50 rounded-xl p-4 border border-gray-700/50 overflow-x-auto">
            <h2 id="participant" data-key="participant" class="text-xl font-bold text-gray-200 mb-3">
              Participant List
            </h2>
            <ul id="participant-list" class="space-y-2 text-gray-300 w-full"></ul>
          </div>
        </div>

        <!-- Back to Home -->
        <div class="text-center mt-8">
          <button id="return-button" data-key="returnButton" onclick="location.href='../'"
            class="text-gray-400 hover:text-white underline pixel-font text-xl transition">
            &lt; return
          </button>
        </div>
      </div>
    </div>
  </main>

  <audio id="remoteAudioOutput" playsinline style="display: none;"></audio>

  <div id="background"></div>
  <nav id="nav"></nav>
  <div id="sidebar"></div>
  <footer id="footer"></footer>

  <script src="./common.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@msgpack/msgpack@latest/dist.umd/msgpack.min.js"></script>
  <script src="./vendor-script.js"></script>
</body>

</html>
