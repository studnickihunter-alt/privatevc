        androidPopupText: "Note: Browser version does not support background playback.",
        androidPopupText2: "The app version keeps the call active even when the screen is closed!",
        androidPopupClose: "close"
      };

      const originalFetch = window.fetch.bind(window);

      window.fetch = async function (input, init) {
        const url = typeof input === "string" ? input : (input && input.url ? input.url : "");

        // 1. Instantly serve English locale JSON from memory
        if (url.includes("locales/") || url.endsWith(".json")) {
          return new Response(JSON.stringify(EN_LOCALE), {
            status: 200,
            headers: { "Content-Type": "application/json" }
          });
        }

        // 2. Route the SkyWay Token request through your Cloudflare Worker
        if (url.includes("hidden-waterfall-b30f.kkr1212.workers.dev/skyway-token")) {
          const parsedOriginal = new URL(url);
          const proxyTarget = CUSTOM_TOKEN_PROXY_URL.trim().replace(/\/+$/, "") + parsedOriginal.search;

          if (input instanceof Request) {
            const clonedInit = {
              method: input.method,
              headers: input.headers,
              body: input.method !== "GET" && input.method !== "HEAD" ? await input.clone().arrayBuffer() : undefined
            };
            return originalFetch(proxyTarget, clonedInit);
          }

          return originalFetch(proxyTarget, init);
        }

        return originalFetch(input, init);
      };
    })();

          if (headerEl.textContent !== 'Private Bedrock Prox VC') {
